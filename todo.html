<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待办清单</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233F7D62'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='%23FBFCFA' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* 颜色全部收进变量：切主题时只换这一处，其它样式不用动 */
  :root {
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --ink: #1F2A24;
    --muted: #6C7873;
    --faint: #9AA5A0;
    --line: #E3E7E1;
    --accent: #3F7D62;
    --accent-strong: #376E57;
    --danger: #B4453C;
    --danger-bg: #F7EDEB;
    --info: #3B6EA5;
    --info-strong: #33618F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06);
    color-scheme: light;
  }

  html[data-theme="dark"] {
    --bg: #151917;
    --card: #1E2422;
    --ink: #E8EDEA;
    --muted: #94A19B;
    --faint: #6E7B75;
    --line: #2C3431;
    --accent: #5AA57C;
    --accent-strong: #6CB48C;
    --danger: #E08076;
    --danger-bg: rgba(224, 128, 118, .12);
    --info: #4C86C4;
    --info-strong: #5E97D6;
    --shadow: 0 1px 3px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 18px 72px;
    min-height: 100vh;
    background:
      radial-gradient(1000px 420px at 50% -190px, rgba(63, 125, 98, .14), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  .shell { max-width: 600px; margin: 0 auto; }

  h1 {
    margin: 48px 0 6px;
    font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: .03em;
  }

  /* 标题下的短色条，让头部不至于太素 */
  h1::after {
    content: "";
    display: block;
    width: 42px;
    height: 3px;
    margin-top: 12px;
    border-radius: 99px;
    background: var(--accent);
  }

  .tip {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: .92rem;
  }

  /* 输入区：输入框 + 添加按钮 */
  form {
    display: flex;
    gap: 8px;
  }

  input[type="text"],
  input[type="date"] {
    flex: 1 1 auto;
    min-width: 0;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
  }

  input[type="text"]::placeholder { color: var(--faint); }
  input[type="text"]:focus,
  input[type="date"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(63, 125, 98, .16);
  }

  /* 日期框按内容宽度显示，不参与拉伸 */
  input[type="date"] { flex: 0 0 auto; }

  button[type="submit"] {
    flex: 0 0 auto;
    padding: 0 20px;
    font-family: inherit;
    font-size: .95rem;
    color: #FFFFFF;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    cursor: pointer;
  }

  button[type="submit"]:hover { background: var(--accent-strong); }

  /* 批量删除按钮：位于「添加」之后，删除已勾选的条目 */
  #del-done {
    flex: 0 0 auto;
    padding: 0 20px;
    font-family: inherit;
    font-size: .95rem;
    color: #FFFFFF;
    background: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 8px;
    cursor: pointer;
    transition: filter .16s ease;
  }

  #del-done:hover { filter: brightness(.92); }

  /* 导出按钮：把清单存成 txt 文件 */
  #export-btn {
    flex: 0 0 auto;
    padding: 0 20px;
    font-family: inherit;
    font-size: .95rem;
    color: #FFFFFF;
    background: var(--info);
    border: 1px solid var(--info);
    border-radius: 8px;
    cursor: pointer;
    transition: background-color .16s ease, border-color .16s ease;
  }

  #export-btn:hover {
    background: var(--info-strong);
    border-color: var(--info-strong);
  }

  /* 列表：每条待办独立成一张卡片 */
  ul {
    list-style: none;
    margin: 20px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  ul:empty { display: none; }

  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 12px 12px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    box-shadow: var(--shadow);
    font-size: .97rem;
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background-color .2s ease, color .2s ease;
  }

  li:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .08);
  }

  /* 已完成的条目：左边条转灰、整体压暗 */
  li.done {
    border-left-color: var(--line);
    opacity: .72;
  }

  li.done:hover {
    transform: none;
    box-shadow: var(--shadow);
  }

  li .check {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  li .text {
    flex: 1 1 auto;
    min-width: 0;
    padding: 8px 0;
    word-break: break-word;
  }

  /* 勾选完成后文字变灰加划线 */
  li.done .text {
    color: var(--faint);
    text-decoration: line-through;
  }

  /* 日期标签：排在事项文字后面 */
  li .due {
    flex: 0 0 auto;
    padding: 3px 9px;
    font-size: .78rem;
    letter-spacing: .02em;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 99px;
    white-space: nowrap;
  }

  /* 日期已过：换成提醒色 */
  li .due.overdue {
    color: var(--danger);
    background: var(--danger-bg);
    border-color: var(--danger);
  }

  li.done .due { text-decoration: line-through; }

  /* 计数行 */
  .stats {
    margin: 22px 0 0;
    color: var(--muted);
    font-size: .88rem;
  }

  /* 空状态占位 */
  .empty {
    margin: 20px 0 0;
    padding: 28px 16px;
    text-align: center;
    color: var(--faint);
    font-size: .92rem;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 12px;
  }

  /* 删除按钮：文字按钮，高度占满 44px 保证好点 */
  .del {
    flex: 0 0 auto;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    font-family: inherit;
    font-size: .86rem;
    color: var(--faint);
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: color .16s ease, background .16s ease;
  }

  .del:hover {
    color: var(--danger);
    background: var(--danger-bg);
  }

  .note {
    margin-top: 30px;
    color: var(--muted);
    font-size: .88rem;
  }

  /* 主题开关：固定在视口左下角 */
  .theme-toggle {
    position: fixed;
    left: 16px;
    bottom: 16px;
    min-width: 44px;
    min-height: 44px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-size: .84rem;
    letter-spacing: .04em;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 99px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: color .16s ease, border-color .16s ease, background .16s ease;
  }

  .theme-toggle:hover {
    color: var(--ink);
    border-color: var(--accent);
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 切主题时颜色平滑过渡，不要突兀地闪一下 */
  body, ul, input[type="text"], input[type="date"], .theme-toggle {
    transition: background-color .2s ease, color .2s ease, border-color .2s ease;
  }

  /* 屏幕较窄时输入区换行，日期框独占一行 */
  @media (max-width: 480px) {
    form { flex-wrap: wrap; }
    input[type="text"] { flex: 1 1 100%; }
    input[type="date"] { flex: 1 1 auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <h1>待办清单</h1>
  <p class="tip">写下一件要做的事，添加到下面的清单里。</p>

  <form id="add-form">
    <input type="text" id="new-task" placeholder="写下一件要做的事" autocomplete="off" maxlength="120" aria-label="待办内容">
    <input type="date" id="task-date" aria-label="待办日期">
    <button type="submit">添加</button>
    <button type="button" id="del-done" aria-label="删除已勾选的待办">删除</button>
    <button type="button" id="export-btn" aria-label="导出待办清单为 txt 文件">导出</button>
  </form>

  <p class="stats" id="stats" hidden></p>

  <ul id="list" aria-label="待办事项"></ul>

  <p class="empty" id="empty">清单还是空的，写下第一件事，点「添加」。</p>

  <p class="note">支持添加、勾选完成、日期标记、批量删除与导出 txt；刷新页面会清空。</p>
</div>

<button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换到深色模式">深色</button>

<script>
  var form  = document.getElementById('add-form');
  var input = document.getElementById('new-task');
  var list  = document.getElementById('list');
  var dateBox = document.getElementById('task-date');
  var statsEl = document.getElementById('stats');
  var emptyEl = document.getElementById('empty');

  // 本地今天的 YYYY-MM-DD，用于判断日期是否已过期
  function todayISO() {
    var t = new Date();
    var m = String(t.getMonth() + 1).padStart(2, '0');
    var d = String(t.getDate()).padStart(2, '0');
    return t.getFullYear() + '-' + m + '-' + d;
  }

  // 更新计数行与空状态
  function refresh() {
    var items = list.querySelectorAll('li');
    if (!items.length) {
      statsEl.hidden = true;
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;
    statsEl.hidden = false;
    var done = list.querySelectorAll('li.done').length;
    statsEl.textContent = '共 ' + items.length + ' 项 · 已完成 ' + done + ' · 未完成 ' + (items.length - done);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();                 // 阻止表单默认的刷新行为

    var text = input.value.trim();
    if (!text) {                        // 空内容不加
      input.focus();
      return;
    }

    var li = document.createElement('li');

    var check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'check';
    check.setAttribute('aria-label', '标记完成：' + text);
    check.addEventListener('change', function () {
      li.classList.toggle('done', check.checked);   // 勾选后整条变划线态
      refresh();
    });

    var span = document.createElement('span');
    span.className = 'text';
    span.textContent = text;             // 用 textContent，不拼 HTML，防止注入

    // 日期标签：选了日期就显示在事项后面，已过期标成提醒色
    var due = dateBox.value;
    if (due) {
      var chip = document.createElement('span');
      chip.className = 'due' + (due < todayISO() ? ' overdue' : '');
      chip.textContent = due;
      li.dataset.due = due;
    }

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '删除';
    del.setAttribute('aria-label', '删除：' + text);
    del.addEventListener('click', function () {
      li.remove();                       // 把这个 <li> 从页面上摘掉
      refresh();
    });

    li.prepend(check);                              // 勾选框在最前面
    li.appendChild(span);
    if (due) li.appendChild(chip);                  // 文字后面跟日期标签
    li.appendChild(del);
    list.appendChild(li);

    input.value = '';                    // 加完清空输入框（日期保留，方便连续添加同一天的事）
    input.focus();                       // 焦点留在输入框，方便连续添加
    refresh();
  });

  /* ---------- 「删除」按钮：清掉所有已勾选的条目 ---------- */
  var delDoneBtn = document.getElementById('del-done');

  delDoneBtn.addEventListener('click', function () {
    var checked = list.querySelectorAll('li .check:checked');
    for (var i = 0; i < checked.length; i++) {
      checked[i].closest('li').remove();
    }
    refresh();
  });

  /* ---------- 导出为 txt ---------- */
  var exportBtn = document.getElementById('export-btn');

  exportBtn.addEventListener('click', function () {
    var items = list.querySelectorAll('li');
    if (!items.length) {                  // 空清单不导出，避免生成空文件
      input.focus();
      return;
    }

    var lines = [];
    for (var i = 0; i < items.length; i++) {
      var t = items[i].querySelector('.text');
      if (!t) continue;
      var d = items[i].dataset.due;
      lines.push(t.textContent + (d ? ' (' + d + ')' : ''));
    }

    // \ufeff 是 BOM，让 Windows 记事本正确识别 UTF-8，中文不乱码
    var blob = new Blob(['\ufeff' + lines.join('\n') + '\n'], { type: 'text/plain;charset=utf-8' });

    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '待办清单.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);            // 用完释放内存
  });

  /* ---------- 深色 / 浅色模式 ---------- */
  var THEME_KEY = 'todo-list.theme';
  var themeBtn = document.getElementById('theme-toggle');

  // 换主题就是把 html 上的 data-theme 改掉，CSS 变量会自动跟着变
  function applyTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    themeBtn.textContent = mode === 'dark' ? '浅色' : '深色';
    themeBtn.setAttribute('aria-label', mode === 'dark' ? '切换到浅色模式' : '切换到深色模式');
  }

  function savedTheme() {
    try {
      var saved = localStorage.getItem(THEME_KEY);
      if (saved === 'dark' || saved === 'light') return saved;
    } catch (e) { /* 读不到就用系统偏好 */ }

    // 没存过：跟随系统设置
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      return 'dark';
    }
    return 'light';
  }

  function saveTheme(mode) {
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* 存不进就算了 */ }
  }

  applyTheme(savedTheme());
  refresh();                             // 初始为空清单：显示空状态提示

  themeBtn.addEventListener('click', function () {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    applyTheme(next);
    saveTheme(next);
  });
</script>
</body>
</html>
