<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待办清单</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233F7D62'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='%23FBFCFA' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* 颜色全部收进变量：切主题时只换这一处，其它样式不用动 */
  :root {
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --ink: #1F2A24;
    --muted: #6C7873;
    --faint: #9AA5A0;
    --line: #E3E7E1;
    --accent: #3F7D62;
    --accent-strong: #376E57;
    --danger: #B4453C;
    --danger-bg: #F7EDEB;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06);
    color-scheme: light;
  }

  html[data-theme="dark"] {
    --bg: #151917;
    --card: #1E2422;
    --ink: #E8EDEA;
    --muted: #94A19B;
    --faint: #6E7B75;
    --line: #2C3431;
    --accent: #5AA57C;
    --accent-strong: #6CB48C;
    --danger: #E08076;
    --danger-bg: rgba(224, 128, 118, .12);
    --shadow: 0 1px 3px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 18px 72px;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  .shell { max-width: 600px; margin: 0 auto; }

  h1 {
    margin: 48px 0 6px;
    font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: .03em;
  }

  .tip {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: .92rem;
  }

  /* 输入区：输入框 + 添加按钮 */
  form {
    display: flex;
    gap: 8px;
  }

  input[type="text"],
  input[type="date"] {
    flex: 1 1 auto;
    min-width: 0;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
  }

  input[type="text"]::placeholder { color: var(--faint); }
  input[type="text"]:focus,
  input[type="date"]:focus { border-color: var(--accent); }

  /* 日期框按内容宽度显示，不参与拉伸 */
  input[type="date"] { flex: 0 0 auto; }

  button[type="submit"] {
    flex: 0 0 auto;
    padding: 0 20px;
    font-family: inherit;
    font-size: .95rem;
    color: #FFFFFF;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    cursor: pointer;
  }

  button[type="submit"]:hover { background: var(--accent-strong); }

  /* 列表 */
  ul {
    list-style: none;
    margin: 18px 0 0;
    padding: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  ul:empty { display: none; }

  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px 6px 16px;
    border-bottom: 1px solid var(--line);
    font-size: .97rem;
  }

  li:last-child { border-bottom: none; }

  li .text {
    flex: 1 1 auto;
    min-width: 0;
    padding: 8px 0;
    word-break: break-word;
  }

  /* 删除按钮：文字按钮，高度占满 44px 保证好点 */
  .del {
    flex: 0 0 auto;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    font-family: inherit;
    font-size: .86rem;
    color: var(--faint);
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: color .16s ease, background .16s ease;
  }

  .del:hover {
    color: var(--danger);
    background: var(--danger-bg);
  }

  .note {
    margin-top: 30px;
    color: var(--muted);
    font-size: .88rem;
  }

  /* 主题开关：固定在视口左下角 */
  .theme-toggle {
    position: fixed;
    left: 16px;
    bottom: 16px;
    min-width: 44px;
    min-height: 44px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-size: .84rem;
    letter-spacing: .04em;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 99px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: color .16s ease, border-color .16s ease, background .16s ease;
  }

  .theme-toggle:hover {
    color: var(--ink);
    border-color: var(--accent);
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 切主题时颜色平滑过渡，不要突兀地闪一下 */
  body, ul, input[type="text"], input[type="date"], .theme-toggle {
    transition: background-color .2s ease, color .2s ease, border-color .2s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <h1>待办清单</h1>
  <p class="tip">写下一件要做的事，添加到下面的清单里。</p>

  <form id="add-form">
    <input type="text" id="new-task" placeholder="写下一件要做的事" autocomplete="off" maxlength="120" aria-label="待办内容">
    <input type="date" id="task-date" aria-label="待办日期">
    <button type="submit">添加</button>
  </form>

  <ul id="list" aria-label="待办事项"></ul>

  <p class="note">当前版本支持添加和删除，刷新页面会清空。</p>
</div>

<button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换到深色模式">深色</button>

<script>
  var form  = document.getElementById('add-form');
  var input = document.getElementById('new-task');
  var list  = document.getElementById('list');

  form.addEventListener('submit', function (e) {
    e.preventDefault();                 // 阻止表单默认的刷新行为

    var text = input.value.trim();
    if (!text) {                        // 空内容不加
      input.focus();
      return;
    }

    var li = document.createElement('li');

    var span = document.createElement('span');
    span.className = 'text';
    span.textContent = text;             // 用 textContent，不拼 HTML，防止注入

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '删除';
    del.setAttribute('aria-label', '删除：' + text);
    del.addEventListener('click', function () {
      li.remove();                       // 把这个 <li> 从页面上摘掉
    });

    li.appendChild(span);
    li.appendChild(del);
    list.appendChild(li);

    input.value = '';                    // 加完清空输入框
    input.focus();                       // 焦点留在输入框，方便连续添加
  });

  /* ---------- 深色 / 浅色模式 ---------- */
  var THEME_KEY = 'todo-list.theme';
  var themeBtn = document.getElementById('theme-toggle');

  // 换主题就是把 html 上的 data-theme 改掉，CSS 变量会自动跟着变
  function applyTheme(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    themeBtn.textContent = mode === 'dark' ? '浅色' : '深色';
    themeBtn.setAttribute('aria-label', mode === 'dark' ? '切换到浅色模式' : '切换到深色模式');
  }

  function savedTheme() {
    try {
      var saved = localStorage.getItem(THEME_KEY);
      if (saved === 'dark' || saved === 'light') return saved;
    } catch (e) { /* 读不到就用系统偏好 */ }

    // 没存过：跟随系统设置
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      return 'dark';
    }
    return 'light';
  }

  function saveTheme(mode) {
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* 存不进就算了 */ }
  }

  applyTheme(savedTheme());

  themeBtn.addEventListener('click', function () {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var next = isDark ? 'light' : 'dark';
    applyTheme(next);
    saveTheme(next);
  });
</script>
</body>
</html>
